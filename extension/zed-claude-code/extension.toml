id = "zed-claude-code"
name = "Send to Claude Code"
description = "Bridges Zed to Claude Code's /ide command via a local sidecar."
version = "0.1.0"
schema_version = 1
authors = ["sx-chen <sx.chen@aftership.com>"]
repository = "https://github.com/sx-chen/claude-code-zed"

# Slash command exposed in Zed's assistant panel.
#
#   /send-to-claude <file> <start-line> <end-line>
#
# Lines are 0-indexed (matching the IPC frame format the sidecar expects).
# `<file>` is interpreted relative to the worktree root if not absolute.
[slash_commands.send-to-claude]
description = "Send `@<file>#L<start>-<end>` to the Claude Code CLI's active prompt via the local sidecar."
requires_argument = true
tooltip_text = "Send the given file range to Claude Code"

# Process spawn capability — the slash command shells out to the
# `zed-claude-bridge` binary (in helper mode) to talk to the sidecar's
# Unix-domain socket, since the WASM extension sandbox does not expose raw
# socket I/O.
[[capabilities]]
kind = "process:exec"
command = "zed-claude-bridge"
args = [
    "ipc-send-at-mention",
    "--workspace", "*",
    "--file-path", "*",
    "--line-start", "*",
    "--line-end", "*",
]

[[capabilities]]
kind = "process:exec"
command = "zed-claude-bridge"
args = [
    "ipc-send-workspace-folders",
    "--workspace", "*",
    "--folder", "*",
]

[[capabilities]]
kind = "process:exec"
command = "zed-claude-bridge"
args = [
    "--workspace", "*",
    "--foreground",
]
