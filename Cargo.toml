[workspace]
resolver = "2"
members = [
    "crates/zed-claude-bridge",
]
# extension/zed-claude-code is a separate wasm32-wasip1 build target, not part of the host workspace
# (it would otherwise force the whole workspace to resolve features for wasm).
exclude = [
    "extension/zed-claude-code",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sx-chen/claude-code-zed"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
panic = "warn"
