[package]
name = "zed-claude-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local sidecar that bridges Zed to Claude Code's /ide command via a WebSocket MCP server."

[lints]
workspace = true

[[bin]]
name = "zed-claude-bridge"
path = "src/main.rs"

[lib]
name = "zed_claude_bridge"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time", "fs", "process"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
# xxhash-rust: required by `specs/ipc/spec.md` to compute the workspace-hash
# component of `$TMPDIR/zed-claude-bridge-<xxh3-hex>.sock` so the Zed extension
# and the sidecar agree on the IPC socket path. xxh3_64 is non-cryptographic;
# any other algorithm would break compatibility.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# rusqlite (bundled SQLite) reads Zed's local workspace state DB read-only.
# `bundled` pins a known SQLite version into the binary so we don't depend on
# the host's libsqlite3 (avoids version-skew with Zed's own copy).
rusqlite = { version = "0.40", features = ["bundled"] }
# notify watches Zed's db.sqlite-wal for changes to trigger active-file refresh.
notify = "8"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time", "fs", "process"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
http = "1"

# macOS-only deps used exclusively by
# `transport::cwd_resolver::LibprocCwdResolver`:
# - `libproc` provides the safe-Rust wrapper for
#   `proc_listallpids` / `proc_pidfdinfo<SocketFDInfo>`. Pinned to the
#   0.14 minor (current stable 0.14.11).
# - `libc` is declared explicitly (per team-lead decision recorded in
#   task #8's blocker resolution) rather than relying on a transitive
#   pull-in from tokio. We need `libc::proc_pidinfo`,
#   `libc::PROC_PIDVNODEPATHINFO`, and `libc::proc_vnodepathinfo` to
#   read a target PID's cwd directly — libproc 0.14 does not expose a
#   safe wrapper for `VNodePathInfo` (confirmed in the libproc source
#   inspection recorded in design.md D2). This is one of the two
#   narrow `unsafe`-permitted FFI boundaries authorised by the
#   `.harness/project.md` exception.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
libproc = "0.14"
