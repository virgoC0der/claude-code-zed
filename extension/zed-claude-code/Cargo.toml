[package]
name = "zed-claude-code"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Zed extension that bridges to the local zed-claude-bridge sidecar so Claude Code's /ide can discover this Zed window."
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
# Pinned to the latest stable (0.7) zed_extension_api at the time of writing;
# `extension.toml`'s `schema_version = 1` is what Zed actually checks at load
# time. See https://zed.dev/docs/extensions for compatibility notes.
zed_extension_api = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# The host workspace excludes this crate (it's a wasm32-wasip1 target). Build
# directly with `cargo build -p zed-claude-code --target wasm32-wasip1` once
# the toolchain target is installed (`rustup target add wasm32-wasip1`).
